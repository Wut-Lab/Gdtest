<title>Square Hop Godot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --sky: #1b2440;
  --ink: #eef1fa;
  --ink-dim: #a9b3d1;
  --goal: #79e2c2;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
#canvas { display: block; width: 100%; height: 100%; outline: none; }
#status {
  position: fixed;
  inset: 0;
  display: grid;
  place-content: center;
  gap: 12px;
  text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--sky);
}
#status h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.03em; }
#msg { color: var(--ink-dim); font-size: 0.9375rem; max-width: 36ch; line-height: 1.5; }
#bar { width: min(280px, 70vw); height: 6px; accent-color: var(--goal); }
</style>

<canvas id="canvas" tabindex="0">This game needs a browser with WebGL 2.</canvas>
<div id="status">
  <h1>Square Hop</h1>
  <div id="msg">Loading the Godot engine (about 13 MB)…</div>
  <progress id="bar"></progress>
</div>

<script>
// The engine (gzipped) and game data are published as base64 text so they fit the host's
// file rules. When Godot asks for index.wasm or index.pck, decode them here instead.
(() => {
  const realFetch = window.fetch.bind(window);
  async function decodeFile(path) {
    const res = await realFetch(path);
    if (!res.ok) throw new Error('could not download ' + path + ' (HTTP ' + res.status + ')');
    const text = (await res.text()).trim();
    if (Uint8Array.fromBase64) return Uint8Array.fromBase64(text);
    const bin = atob(text);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  window.fetch = async (input, init) => {
    const url = typeof input === 'string' ? input : input.url;
    if (/index\.wasm$/.test(url)) {
      const gz = await decodeFile('index.wasm.gz.b64.txt');
      const wasm = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(wasm, { headers: { 'Content-Type': 'application/wasm' } });
    }
    if (/index\.pck$/.test(url)) {
      const pck = await decodeFile('index.pck.b64.txt');
      return new Response(pck, { headers: { 'Content-Type': 'application/octet-stream' } });
    }
    return realFetch(input, init);
  };
})();
</script>
<script src="index.js"></script>
<script>
(() => {
  const status = document.getElementById('status');
  const msg = document.getElementById('msg');
  const bar = document.getElementById('bar');
  const fail = (text) => { msg.textContent = text; bar.hidden = true; };

  if (typeof Engine === 'undefined') { fail('The game files did not load. Reload the page to try again.'); return; }
  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length) { fail('This browser is missing features the game needs: ' + missing.join(', ') + '.'); return; }

  const engine = new Engine({
    args: [], canvasResizePolicy: 2, executable: 'index', experimentalVK: false,
    fileSizes: { 'index.pck': 41488, 'index.wasm': 37700666 },
    focusCanvas: true, gdextensionLibs: [], emscriptenPoolSize: 8, godotPoolSize: 4,
    ensureCrossOriginIsolationHeaders: false,
  });
  engine.startGame({
    onProgress(current, total) {
      if (total > 0) { bar.max = total; bar.value = current; }
    },
  }).then(() => { status.hidden = true; },
    (err) => fail('The game could not start: ' + (err && err.message ? err.message : err)));
})();
</script>
