<title>Square Hop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen game. Thin header bar, then a stage that scales the 960×544 level to fit; touch pad floats over the stage's bottom edge. Single committed dusk look. */
:root {
  --sky-top: #1b2440;
  --sky-bot: #3d4f7c;
  --stone: #e2a86f;
  --stone-top: #f7d5a6;
  --stone-side: #ad7546;
  --hero: #ff6b5e;
  --goal: #79e2c2;
  --ink: #eef1fa;
  --ink-dim: #a9b3d1;
  --panel: rgba(17, 23, 43, 0.88);
  --line: rgba(238, 241, 250, 0.14);
  --font-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--sky-top);
  color: var(--ink);
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 16px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.25rem;
  letter-spacing: 0.04em;
}
h1 span { color: var(--hero); }
.hint { font-size: 0.8125rem; color: var(--ink-dim); }
kbd {
  font-family: var(--font-body);
  font-size: 0.75rem;
  padding: 1px 6px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  color: var(--ink);
}
#stage {
  position: relative;
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  touch-action: none;
  outline: none;
}
canvas { display: block; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.35); }

.card {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.card > div {
  pointer-events: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px 24px;
  max-width: 340px;
  text-align: center;
  display: grid;
  gap: 12px;
}
.card h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.5rem;
  text-wrap: balance;
}
.card p { margin: 0; color: var(--ink-dim); line-height: 1.5; font-size: 0.9375rem; }
.card strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.card button {
  justify-self: center;
  font: 700 1rem var(--font-display);
  letter-spacing: 0.05em;
  color: #1b2440;
  background: var(--goal);
  border: 0;
  border-radius: 6px;
  padding: 10px 28px;
  cursor: pointer;
}
.card button:focus-visible, .pad button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.pad {
  position: absolute;
  left: 0; right: 0;
  bottom: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.pad .group { display: flex; gap: 12px; }
.pad button {
  pointer-events: auto;
  touch-action: none;
  width: 76px; height: 76px;
  border-radius: 50%;
  border: 2px solid rgba(238,241,250,0.35);
  background: rgba(17,23,43,0.55);
  color: var(--ink);
  font: 700 1rem var(--font-display);
  display: grid;
  place-items: center;
}
.pad button.jump { width: 92px; height: 92px; border-color: rgba(121,226,194,0.6); }
.pad button.down { background: rgba(238,241,250,0.25); transform: scale(0.95); }
.pad svg { width: 28px; height: 28px; fill: currentColor; }

.touch-only { display: none; }
body.touch .touch-only { display: revert; }
body.touch .key-only { display: none; }
body.touch .pad { display: flex; }
.pad { display: none; }
</style>

<header>
  <h1>Square <span>Hop</span></h1>
  <div class="hint">
    <span class="key-only"><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> move · <kbd>Space</kbd> jump · <kbd>R</kbd> restart</span>
    <span class="touch-only">Use the on-screen buttons to move and jump</span>
  </div>
</header>

<div id="stage" tabindex="0" aria-label="Game area">
  <canvas id="game" aria-label="Platformer level: move the red square to the green goal square"></canvas>

  <div class="card" id="startCard">
    <div>
      <h2>Reach the goal</h2>
      <p>Hop the red square across the pit and up the ledges to the green goal. Hold jump to go higher. You can steer a little in mid-air.</p>
      <button id="playBtn" type="button">Play</button>
    </div>
  </div>

  <div class="card" id="winCard" hidden>
    <div>
      <h2>Goal reached</h2>
      <p>Time <strong id="winTime">0.00s</strong> · Falls <strong id="winFalls">0</strong></p>
      <button id="againBtn" type="button">Play again</button>
    </div>
  </div>

  <div class="pad" aria-hidden="false">
    <div class="group">
      <button type="button" id="btnLeft" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8z"/></svg></button>
      <button type="button" id="btnRight" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8z"/></svg></button>
    </div>
    <button type="button" class="jump" id="btnJump" aria-label="Jump">JUMP</button>
  </div>
</div>

<script>
(() => {
  // ---------- World ----------
  const T = 32, COLS = 30, ROWS = 17, W = COLS * T, H = ROWS * T;
  // Solid blocks in tile units: [col, row, width, height]
  const SOLIDS = [
    [0, 15, 11, 2],   // starting ground
    [14, 15, 16, 2],  // ground after the pit
    [6, 13, 2, 2],    // practice step
    [22, 12, 4, 1],   // platform A (jump up from the ground, heading right)
    [17, 9, 3, 1],    // platform B (turn back left)
    [11, 6, 4, 1],    // goal ledge, above the pit
  ];
  const grid = new Uint8Array(COLS * ROWS);
  for (const [c, r, w, h] of SOLIDS)
    for (let y = r; y < r + h; y++) for (let x = c; x < c + w; x++) grid[y * COLS + x] = 1;
  const solid = (c, r) => (c < 0 || c >= COLS) ? true : (r < 0 || r >= ROWS) ? false : grid[r * COLS + c] === 1;

  const PSIZE = 24;
  const START = { x: 2 * T + 4, y: 15 * T - PSIZE };
  const GOAL = { x: 13 * T - 12, y: 6 * T - PSIZE - 6, w: PSIZE, h: PSIZE };

  // ---------- Tuning ----------
  const STEP = 1 / 120;
  const RUN = 250;          // max horizontal speed (px/s)
  const ACC_GROUND = 2600, DEC_GROUND = 3000;
  const ACC_AIR = 900, DEC_AIR = 250;   // "slight" air control
  const GRAVITY = 2200, FALL_MAX = 900;
  const JUMP_V = 760;       // ~4 tiles high with a full hold
  const CUT_GRAVITY = 2.6;  // extra gravity when jump is released early
  const COYOTE = 0.1, BUFFER = 0.12;

  // ---------- State ----------
  const input = { left: false, right: false, jump: false };
  let jumpBuffer = 0;
  const p = { x: 0, y: 0, w: PSIZE, h: PSIZE, vx: 0, vy: 0, onGround: false, coyote: 0, face: 1, sx: 1, sy: 1 };
  let state = 'ready', time = 0, falls = 0, t = 0;
  const dust = [];

  function resetPlayer() {
    Object.assign(p, { x: START.x, y: START.y, vx: 0, vy: 0, onGround: true, coyote: 0, sx: 1, sy: 1 });
  }
  function newRun() {
    resetPlayer(); time = 0; falls = 0; jumpBuffer = 0; dust.length = 0;
    state = 'play';
    startCard.hidden = true; winCard.hidden = true;
    stage.focus({ preventScroll: true });
  }

  // ---------- Physics ----------
  function moveX(dx) {
    p.x += dx;
    const top = Math.floor(p.y / T), bot = Math.floor((p.y + p.h - 0.001) / T);
    if (dx > 0) {
      const c = Math.floor((p.x + p.w - 0.001) / T);
      for (let r = top; r <= bot; r++) if (solid(c, r)) { p.x = c * T - p.w; p.vx = 0; return; }
    } else if (dx < 0) {
      const c = Math.floor(p.x / T);
      for (let r = top; r <= bot; r++) if (solid(c, r)) { p.x = (c + 1) * T; p.vx = 0; return; }
    }
  }
  function moveY(dy) {
    p.y += dy;
    const left = Math.floor(p.x / T), right = Math.floor((p.x + p.w - 0.001) / T);
    if (dy > 0) {
      const r = Math.floor((p.y + p.h - 0.001) / T);
      for (let c = left; c <= right; c++) if (solid(c, r)) {
        p.y = r * T - p.h;
        if (!p.onGround && p.vy > 300) { p.sx = 1.25; p.sy = 0.75; puff(p.x + p.w / 2, p.y + p.h, 6); }
        p.vy = 0; p.onGround = true; return;
      }
    } else if (dy < 0) {
      const r = Math.floor(p.y / T);
      for (let c = left; c <= right; c++) if (solid(c, r)) { p.y = (r + 1) * T; p.vy = 0; return; }
    }
  }
  const approach = (v, target, amt) => v < target ? Math.min(v + amt, target) : Math.max(v - amt, target);

  function update(dt) {
    t += dt;
    for (let i = dust.length - 1; i >= 0; i--) {
      const d = dust[i]; d.life -= dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 300 * dt;
      if (d.life <= 0) dust.splice(i, 1);
    }
    p.sx = approach(p.sx, 1, 4 * dt); p.sy = approach(p.sy, 1, 4 * dt);
    if (state !== 'play') return;
    time += dt;

    const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (dir) p.face = dir;
    if (dir) p.vx = approach(p.vx, dir * RUN, (p.onGround ? ACC_GROUND : ACC_AIR) * dt);
    else p.vx = approach(p.vx, 0, (p.onGround ? DEC_GROUND : DEC_AIR) * dt);

    p.coyote = p.onGround ? COYOTE : Math.max(0, p.coyote - dt);
    jumpBuffer = Math.max(0, jumpBuffer - dt);
    if (jumpBuffer > 0 && p.coyote > 0) {
      p.vy = -JUMP_V; p.onGround = false; p.coyote = 0; jumpBuffer = 0;
      p.sx = 0.75; p.sy = 1.3; puff(p.x + p.w / 2, p.y + p.h, 4);
    }

    let g = GRAVITY;
    if (p.vy < 0 && !input.jump) g *= CUT_GRAVITY;
    p.vy = Math.min(p.vy + g * dt, FALL_MAX);

    p.onGround = false;
    moveX(p.vx * dt);
    moveY(p.vy * dt);

    if (p.y > H + 80) { falls++; resetPlayer(); }

    if (p.x < GOAL.x + GOAL.w && p.x + p.w > GOAL.x && p.y < GOAL.y + GOAL.h && p.y + p.h > GOAL.y) win();
  }
  function puff(x, y, n) {
    for (let i = 0; i < n; i++) dust.push({ x, y, vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 120, life: 0.35 + Math.random() * 0.2 });
  }
  function win() {
    state = 'won';
    winTime.textContent = time.toFixed(2) + 's';
    winFalls.textContent = falls;
    winCard.hidden = false;
    againBtn.focus({ preventScroll: true });
  }

  // ---------- Rendering ----------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const css = getComputedStyle(document.documentElement);
  const C = name => css.getPropertyValue(name).trim();
  const colors = { skyTop: C('--sky-top'), skyBot: C('--sky-bot'), stone: C('--stone'), stoneTop: C('--stone-top'),
    stoneSide: C('--stone-side'), hero: C('--hero'), goal: C('--goal'), ink: C('--ink'), line: C('--line') };
  let scale = 1;

  function resize() {
    const r = stage.getBoundingClientRect();
    scale = Math.min(r.width / W, r.height / H);
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
    canvas.width = Math.floor(W * scale * dpr);
    canvas.height = Math.floor(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  new ResizeObserver(resize).observe(stage);

  function draw() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, colors.skyTop); sky.addColorStop(1, colors.skyBot);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = colors.line; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = T; x < W; x += T) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    for (let y = T; y < H; y += T) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.globalAlpha = 0.35; ctx.stroke(); ctx.globalAlpha = 1;

    for (const [c, r, w, h] of SOLIDS) {
      const x = c * T, y = r * T, ww = w * T, hh = h * T;
      ctx.fillStyle = colors.stone; ctx.fillRect(x, y, ww, hh);
      ctx.fillStyle = colors.stoneSide; ctx.fillRect(x, y + hh - 6, ww, 6);
      ctx.fillStyle = colors.stoneTop; ctx.fillRect(x, y, ww, 6);
      ctx.fillStyle = colors.stoneSide;
      for (let i = 1; i < w; i++) ctx.fillRect(x + i * T, y + 6, 1, hh - 12);
    }

    // Goal: pulsing square
    const pulse = 1 + Math.sin(t * 4) * 0.08;
    const gx = GOAL.x + GOAL.w / 2, gy = GOAL.y + GOAL.h / 2 + Math.sin(t * 2.5) * 2;
    ctx.save(); ctx.translate(gx, gy); ctx.scale(pulse, pulse);
    ctx.globalAlpha = 0.25; ctx.fillStyle = colors.goal; ctx.fillRect(-18, -18, 36, 36);
    ctx.globalAlpha = 1; ctx.fillRect(-12, -12, 24, 24);
    ctx.restore();
    ctx.fillStyle = colors.ink; ctx.font = '700 12px "Chakra Petch", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('GOAL', gx, GOAL.y - 14);

    ctx.fillStyle = colors.ink;
    for (const d of dust) { ctx.globalAlpha = Math.max(0, d.life * 2); ctx.fillRect(d.x - 2, d.y - 2, 4, 4); }
    ctx.globalAlpha = 1;

    // Player square with squash & stretch, anchored at its feet
    const pw = p.w * p.sx, ph = p.h * p.sy;
    const px = p.x + p.w / 2 - pw / 2, py = p.y + p.h - ph;
    ctx.fillStyle = colors.hero;
    ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 3); ctx.fill();
    ctx.fillStyle = colors.skyTop;
    const ex = p.x + p.w / 2 + p.face * 4;
    ctx.fillRect(ex - 5, py + ph * 0.3, 3, 5);
    ctx.fillRect(ex + 2, py + ph * 0.3, 3, 5);

    // HUD
    ctx.textAlign = 'left'; ctx.fillStyle = colors.ink;
    ctx.font = '700 18px "Chakra Petch", sans-serif';
    ctx.fillText(time.toFixed(2) + 's', 14, 26);
    ctx.font = '500 13px Inter, sans-serif'; ctx.globalAlpha = 0.7;
    ctx.fillText('Falls ' + falls, 14, 46); ctx.globalAlpha = 1;
  }

  let last = performance.now(), acc = 0;
  function frame(now) {
    acc += Math.min((now - last) / 1000, 0.1); last = now;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- Input ----------
  const startCard = document.getElementById('startCard');
  const winCard = document.getElementById('winCard');
  const winTime = document.getElementById('winTime');
  const winFalls = document.getElementById('winFalls');
  const againBtn = document.getElementById('againBtn');
  document.getElementById('playBtn').addEventListener('click', newRun);
  againBtn.addEventListener('click', newRun);

  const KEYS = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump' };
  function pressJump() { if (!input.jump) jumpBuffer = BUFFER; input.jump = true; }
  window.addEventListener('keydown', e => {
    const k = KEYS[e.code];
    if (e.code === 'KeyR') { newRun(); return; }
    if (!k) return;
    e.preventDefault();
    if (state === 'ready') newRun();
    if (state === 'won') return;
    if (k === 'jump') { if (!e.repeat) pressJump(); } else input[k] = true;
  });
  window.addEventListener('keyup', e => { const k = KEYS[e.code]; if (k) input[k] = false; });
  window.addEventListener('blur', () => { input.left = input.right = input.jump = false; });

  function bindButton(id, key) {
    const el = document.getElementById(id);
    const down = e => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      el.classList.add('down');
      if (state === 'ready') newRun();
      if (key === 'jump') pressJump(); else input[key] = true;
    };
    const up = () => { el.classList.remove('down'); input[key] = false; };
    el.addEventListener('pointerdown', down);
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) el.addEventListener(ev, up);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  bindButton('btnLeft', 'left'); bindButton('btnRight', 'right'); bindButton('btnJump', 'jump');

  const enableTouch = () => document.body.classList.add('touch');
  if (window.matchMedia('(pointer: coarse)').matches) enableTouch();
  window.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') enableTouch(); }, { passive: true });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  resetPlayer();
  resize();
  requestAnimationFrame(frame);
})();
</script>
